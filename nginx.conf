events { worker_connections 1024; }

http {
    upstream backend {
        server 10.0.2.99:8080;
        server 10.0.2.58:8080;
    }

    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 443 ssl;
        server_name tcatelieoficial.zapto.org;

        ssl_certificate /etc/letsencrypt/live/tcatelieoficial.zapto.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tcatelieoficial.zapto.org/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /dashboard {
            alias /usr/share/nginx/html/dashboard/;
            try_files $uri $uri/ /dashboard/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;       
        }
    }
}